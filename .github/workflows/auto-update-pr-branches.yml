name: Auto-update PR branches

# When main advances (a PR merges), merge the new main into every other open
# PR targeting main. Branches that merge cleanly are brought up to date
# automatically; any that would conflict are left untouched for a human to
# resolve. This keeps "Require branches to be up to date before merging"
# from turning every merge into a manual "Update branch" chore.
#
# The merge is done with real git (checkout + merge + push) rather than the
# update-branch REST API, which always attributes its merge commit to
# github-actions[bot]. Both the push token and the commit identity have to be
# a real user for CI to re-run unattended:
#
#   * AUTO_UPDATE_TOKEN authenticates the push. Without it github.token is
#     used, and GitHub's recursion guard means the push triggers no CI at all.
#   * The commit author must not be github-actions[bot]. The repository's
#     fork-PR approval policy is "first_time_contributors", and the bot counts
#     as one — so a bot-authored head commit parks the re-triggered run at
#     "action_required" until a maintainer approves it by hand.
#
# The identity below is therefore read from whoever owns AUTO_UPDATE_TOKEN,
# falling back to the bot only when no user token is available (in which case
# the push would not have re-triggered CI anyway).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-update-pr-branches
  cancel-in-progress: false

jobs:
  update:
    name: Merge main into open PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so merges have every commit they need.
          fetch-depth: 0
          # This token authenticates the pushes below. When it is a
          # user/App PAT (AUTO_UPDATE_TOKEN), the resulting pushes are
          # attributed to that actor and re-trigger CI without approval.
          token: ${{ secrets.AUTO_UPDATE_TOKEN || github.token }}

      - name: Merge main into open PR branches
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          if token_owner=$(gh api user --jq '"\(.login) \(.id)"' 2>/dev/null); then
            read -r login id <<<"$token_owner"
            git config user.name "$login"
            git config user.email "$id+$login@users.noreply.github.com"
            echo "Committing as $login."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "No user token available — committing as github-actions[bot]."
          fi

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          branches=$(gh pr list --repo "$REPO" --base main --state open \
            --json headRefName --jq '.[].headRefName')

          if [ -z "$branches" ]; then
            echo "No open PRs targeting main."
            exit 0
          fi

          for branch in $branches; do
            echo "::group::$branch"

            if ! git fetch origin "$branch"; then
              echo "$branch: could not fetch — skipping"
              echo "::endgroup::"
              continue
            fi

            git checkout -B "$branch" "origin/$branch"

            if git merge --no-edit origin/main; then
              if git diff --quiet "origin/$branch" HEAD; then
                echo "$branch: already up to date"
              elif git push origin "$branch"; then
                echo "$branch: updated to latest main"
              else
                echo "$branch: push failed — skipping"
              fi
            else
              git merge --abort
              echo "$branch: conflicts with main — needs manual resolution"
            fi

            git checkout --force main
            echo "::endgroup::"
          done
