name: task-management-platform

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskdb}
      POSTGRES_DB: ${POSTGRES_DB:-taskdb}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-taskdb} -d ${POSTGRES_DB:-taskdb}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: task-management-platform/task-service:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ['npm', 'run', 'migration:run', '-w', 'backend-services/task-service']
    restart: 'no'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_URL: postgres://${POSTGRES_USER:-taskdb}:${POSTGRES_PASSWORD:-taskdb}@postgres:5432/${POSTGRES_DB:-taskdb}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: task-management-platform/task-service:local
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: '3000'
      DB_URL: postgres://${POSTGRES_USER:-taskdb}:${POSTGRES_PASSWORD:-taskdb}@postgres:5432/${POSTGRES_DB:-taskdb}
      DB_READ_URL: ${DB_READ_URL:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-2000}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      THROTTLE_TTL_SEC: ${THROTTLE_TTL_SEC:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      REALTIME_MAX_CONNECTIONS: ${REALTIME_MAX_CONNECTIONS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
        VITE_REALTIME_URL: ${VITE_REALTIME_URL:-http://localhost:3000/realtime}
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:80/']
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  redis-data:
